# /etc/nginx/sites-available/remote-job-finder
server {
    listen 80;
    server_name example.com www.example.com;   # change to your domain

    root /opt/remote-job-finder/site;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types application/json text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /data/        { expires 10m; }
    location ~* \.(css|js)$ { expires 1h; }
    location / { try_files $uri $uri/ =404; }
}
